[project]
name = "ask-the-docs"
version = "0.1.0"
description = "Section-level search over codebases' Markdown docs for coding agents."
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
# Placeholder until #3 repoints it to ask_the_docs.cli:app.
atd = "ask_the_docs:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_the_docs"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
